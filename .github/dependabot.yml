version: 2
updates:
  # Actions are pinned to commit SHAs, so they need explicit update PRs
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Skip releases younger than a week; security updates are not delayed
    cooldown:
      default-days: 7

  # Python packages are pinned in uv.lock; one grouped PR a month
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
