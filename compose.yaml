services:

  db:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    restart: always
    shm_size: 128mb
    ports: 
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata: