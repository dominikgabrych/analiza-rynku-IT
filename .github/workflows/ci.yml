name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    env:
      # Throwaway password for the CI database, which lives only for this job
      POSTGRES_PASSWORD: ci-only-password
    services:
      db:
        # Same image as compose.yaml
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"

      - name: Install age
        # Encrypts the off-site backup copy; the tests encrypt and decrypt with it
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends age

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      - name: Test
        run: uv run pytest
